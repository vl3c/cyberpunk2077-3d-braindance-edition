; 3D Braindance Edition settings. Restart the game after changing them.

[Log]
; Writes braindance3d.log in this folder (or %LOCALAPPDATA%\Braindance3D if this folder is read-only).
; 0 = off, 1 = normal, 2 = verbose (for bug reports)
Level = 1

[Display]
; auto    = the 3D monitor is the monitor the game window is on
; primary = always the primary monitor (try this if 3D Mode stays greyed out on a multi-monitor PC)
Monitor = auto

; Physical size of the 3D screen in centimetres, as width x height (experimental).
; The game may use it to work out how strong the 3D depth is.
; default = what the game assumes with no Samsung monitor. A 27" 16:9 panel is 59.77 x 33.62
PanelSize = default

[Menus]
; Menus, the map and loading screens are flat 2D pictures. In half side-by-side each eye would see a different half,
; so the mod squeezes the whole picture into each half and both eyes see the same flat screen. Needs RED4ext.
; auto = squeeze flat frames while 3D Mode is on (Ctrl+F8 flips it by hand until the next menu opens or closes),
;        off = never (no hooks are installed)
Squeeze = auto
