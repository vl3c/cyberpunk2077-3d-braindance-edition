; Cyberpunk 2077 3D: Braindance Edition (3DBD) settings. Restart the game after changing them.

[Log]
; Writes braindance3d.log in this folder (or %LOCALAPPDATA%\Braindance3D if this folder is read-only).
; 0 = off, 1 = normal, 2 = verbose (for bug reports)
Level = 1

[Display]
; auto    = the 3D monitor is the monitor the game window is on
; primary = always the primary monitor (try this if 3D Mode stays greyed out on a multi-monitor PC)
Monitor = auto

; What 3D Mode shows:
; auto    = side by side, unless a glasses-free 3D monitor's own software is installed: then the monitor's own 3D
; sbs     = always side by side (for a VR headset, 3D glasses or a 3D TV)
; monitor = always the game's output for glasses-free 3D monitors (for testing: without one, there is no 3D picture)
; Mod Settings' Output (3D Braindance Edition page) set to Half SBS also keeps side by side. Read when the game starts.
Output = auto

[Menus]
; Menus, the map and loading screens are flat 2D pictures. In half side-by-side each eye would see a different half,
; so the mod squeezes the whole picture into each half and both eyes see the same flat screen. Needs RED4ext.
; auto = squeeze flat frames while 3D Mode is on, off = never (the menu squeeze hooks aren't installed)
Squeeze = auto

[Stereo]
; Fixed 3D. It's turned on, with your IPD and the screen size, in the game: Mod Settings, 3D Braindance Edition (or
; Ctrl+F8 for this session). This file is read while the game runs: save it and the new value applies in a second or two.
; Where the flat weapon sits under path tracing, RT Lighting or RT shadows at Weapon Depth 1, in metres. The Weapon
; Depth slider moves it from the screen (0) to here (1).
WeaponDistance = 1.0
